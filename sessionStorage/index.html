<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo de sessionStorage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Exemplo de sessionStorage</h1>
    <p class="descricao">Digite seu nome, salve e depois recupere o valor armazenado na sessão.</p>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" placeholder="Digite seu nome">

    <div class="botoes">
      <button id="btnSalvar">Salvar</button>
      <button id="btnRecuperar">Recuperar</button>
      <button id="btnRemover" class="secundario">Remover</button>
    </div>

    <p id="resultado" class="resultado">Nenhuma ação realizada.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
